<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CRM Disparos{% endblock %} · Clínica (demo)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .cor-verde { background:#A9D08E; } .cor-amarelo { background:#FFD966; } .cor-vermelho { background:#E06666; color:#fff; } .cor-branco { background:#f3f4f6; }
  .tag { display:inline-block; padding:1px 7px; border-radius:9999px; font-size:11px; background:#eef2ff; color:#3730a3; margin:1px; white-space:nowrap; }
  .tag-campanha { background:#ecfdf5; color:#065f46; } .tag-opt-out, .tag-descartado, .tag-blacklist, .tag-em-tratamento, .tag-sem-whatsapp { background:#fee2e2; color:#991b1b; }
  .tag-agendado, .tag-compareceu, .tag-fechou { background:#dcfce7; color:#166534; } .tag-em-negociacao, .tag-prioridade { background:#fef3c7; color:#92400e; }
  .tag-respondeu { background:#dbeafe; color:#1e40af; } .tag-perdido, .tag-mudo { background:#f3f4f6; color:#374151; }
  .tag-duplicado-planilha, .tag-nome-generico, .tag-revisar { background:#fff7ed; color:#9a3412; }
</style>
</head>
<body class="bg-stone-100 text-stone-800">
<div class="flex min-h-screen">
  <aside class="w-56 bg-[#1e3a5f] text-white flex flex-col">
    <div class="px-5 py-5 border-b border-white/20">
      <div class="text-lg font-semibold">Clínica (demo)</div>
      <div class="text-xs opacity-80">CRM de disparos</div>
    </div>
    <nav class="px-3 py-4 text-sm space-y-1">
      <a href="/leads" class="block px-3 py-2 rounded hover:bg-white/10 {% if request.url.path.startswith('/leads') %}bg-white/15{% endif %}">Leads</a>
      <a href="/campanhas" class="block px-3 py-2 rounded hover:bg-white/10 {% if request.url.path.startswith('/campanhas') %}bg-white/15{% endif %}">Campanhas</a>
      <span class="block px-3 py-2 rounded opacity-50 cursor-default">Montar lista <span class="text-[10px]">(próxima etapa)</span></span>
    </nav>
    <div class="mt-auto px-5 py-4 text-[11px] opacity-70 leading-snug">
      Banco: Postgres · Tela: local<br>Esta tela não envia mensagem.
    </div>
  </aside>
  <main class="flex-1 p-6 overflow-x-auto">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
